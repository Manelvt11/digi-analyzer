<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/detalhes.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <title>Digi-Analyzer - Detalhes</title>
</head>
<body>
    <header class="cabecalho-detalhes">
        <a href="index.html" class="material-symbols-outlined">arrow_back</a>

        <h1>Digi-Analyzer</h1>

        <span class="material-symbols-outlined">favorite</span>
    </header>


    <main class="detalhes-digimon">
        <section class="imagem-digimon">

            <img src="" alt="Agumon">

        </section>


        <section class="informacoes-digimon">

            <h2>Agumon</h2>

            <p class="id-digimon">#001</p>

            <p class="nivel-digimon">
                Nível: Rookie
            </p>

            <p class="tipo-digimon">
                Tipo: Reptile
            </p>

            <p class="areas-digimon">
                Áreas: Nature Spirits
            </p>

        </section>


        <section class="descricao-digimon">

            <h2>Descrição</h2>

            <p>
                Um Digimon com um grande coração e muito leal ao seu treinador.
            </p>

        </section>


        <section class="habilidades-digimon">

            <h2>Habilidades</h2>

            <div class="habilidade">

                <h3>Pepper Breath</h3>

                <p>
                    Dispara uma pequena rajada de fogo pela boca.
                </p>

            </div>

        </section>


        <section class="acoes-digimon">

            <a href="index.html">
                Voltar
            </a>

            <button type="button">
                Compartilhar
            </button>

        </section>
    </main>

    <script src="./js/script.js"></script>

</body>

</html>
